name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The debug build writes several GB of CMake artefacts (one tree per ABI
      # and per native module). The runner only ships ~14 GB free, and running
      # out of space is what made the linker abort with "Bus error" and the
      # react-native-reanimated AAR step fail to add its .so files.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install dependencies
        run: npm install

      # Also runs as npm's postinstall, but kept explicit so a build can never start
      # `expo prebuild` without the AI model assets in the native module.
      - name: Download AI models
        run: bash scripts/download-ai-models.sh

      - name: Expo Prebuild
        env:
          CI: 1
        run: npx expo prebuild --platform android

      - name: Build Development APK
        run: |
          cd android
          chmod +x gradlew
          # Every native module honours this property, so only arm64-v8a is
          # compiled instead of all four ABIs. That cuts the native build's
          # disk and memory footprint by roughly 4x on the shared runner.
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
