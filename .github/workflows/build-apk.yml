name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # The debug build writes several GB of CMake artefacts (one tree per ABI
      # and per native module). The runner only ships ~14 GB free, and running
      # out of space is what made the linker abort with "Bus error" and the
      # react-native-reanimated AAR step fail to add its .so files.
      #
      # The preinstalled NDK versions are removed here on purpose: none of them is
      # the one React Native 0.86 / Expo 57 wants (27.1.12297006), and the next
      # step installs exactly that one. Keeping the others only wastes ~10 GB.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf \
            /usr/share/dotnet \
            /opt/ghc \
            /usr/local/.ghcup \
            /usr/local/share/boost \
            /usr/local/lib/android/sdk/emulator \
            /usr/local/lib/android/sdk/system-images \
            /usr/local/lib/android/sdk/ndk \
            /usr/local/lib/android/sdk/sources \
            /usr/local/lib/android/sdk/docs \
            /opt/hostedtoolcache/CodeQL
          df -h /

      # Build #12 failed here, not in Kotlin: Gradle tried to auto-install the NDK
      # and the downloaded archive was truncated ("java.util.zip.ZipException:
      # Archive is not a ZIP archive" from sdkmanager's installer), so the build
      # died while configuring :app. Installing it up front, with retries, a clean
      # download cache and a real verification, keeps that failure out of Gradle.
      - name: Install Android NDK 27.1
        run: |
          set -euo pipefail
          NDK_VERSION="27.1.12297006"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK root: $SDK_ROOT"

          if [ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
            echo "NDK $NDK_VERSION is already installed"
            df -h /
            exit 0
          fi

          SDKMANAGER="$(ls "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -n 1 || true)"
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager was not found under $SDK_ROOT" >&2
            exit 1
          fi
          echo "sdkmanager: $SDKMANAGER"

          yes | "$SDKMANAGER" --sdk_root="$SDK_ROOT" --licenses >/dev/null 2>&1 || true

          for attempt in 1 2 3; do
            echo "::group::NDK install attempt $attempt"
            # A failed attempt can leave a partial archive behind, and sdkmanager
            # reuses it on the next try, so the cache is wiped every time.
            rm -rf "$SDK_ROOT/ndk/$NDK_VERSION" "$SDK_ROOT/.temp" "$SDK_ROOT/.downloadIntermediates"
            if "$SDKMANAGER" --sdk_root="$SDK_ROOT" --install "ndk;$NDK_VERSION"; then
              echo "::endgroup::"
              if [ -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
                echo "NDK $NDK_VERSION installed"
                break
              fi
            fi
            echo "::endgroup::"
            echo "attempt $attempt failed, retrying"
            sleep 15
          done

          if [ ! -f "$SDK_ROOT/ndk/$NDK_VERSION/source.properties" ]; then
            echo "NDK $NDK_VERSION could not be installed" >&2
            df -h /
            exit 1
          fi
          df -h /

      - name: Install dependencies
        run: npm install

      # Also runs as npm's postinstall, but kept explicit so a build can never start
      # `expo prebuild` without the AI model assets in the native module.
      - name: Download AI models
        run: bash scripts/download-ai-models.sh

      # A build must never ship an APK with zero AI models: both assets are gitignored and
      # depend on the download above, so fail loudly here instead of after installation.
      - name: Verify AI models are bundled
        run: |
          set -euo pipefail
          ASSETS="modules/habit-native/android/src/main/assets"
          test -s "$ASSETS/nsfw_mobilenet_v2.tflite"
          test -s "$ASSETS/nudenet_320n.onnx"
          stage1=$(wc -c < "$ASSETS/nsfw_mobilenet_v2.tflite" | tr -d ' ')
          stage2=$(wc -c < "$ASSETS/nudenet_320n.onnx" | tr -d ' ')
          echo "stage 1: $stage1 bytes, stage 2: $stage2 bytes"
          test "$stage1" -gt 2097152
          test "$stage2" -gt 10485760

      - name: Expo Prebuild
        env:
          CI: 1
        run: npx expo prebuild --platform android

      - name: Build Development APK
        run: |
          cd android
          chmod +x gradlew
          # Every native module honours this property, so only arm64-v8a is
          # compiled instead of all four ABIs. That cuts the native build's
          # disk and memory footprint by roughly 4x on the shared runner.
          ./gradlew assembleDebug --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Habit-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
